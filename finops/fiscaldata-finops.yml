description: >-
  FinOps view of Treasury Fiscal Data usage. There is no vendor cost: the API is
  a free public U.S. Government service with no fees, no API key, and no billing.
  The only costs a consumer incurs are their own - the compute, storage, and
  egress for calling the API, ingesting the responses, and retaining or
  reprocessing the data downstream. FinOps discipline here is about controlling
  your own data-transfer and processing footprint (avoid re-pulling full
  datasets, filter server-side, cache results) rather than managing a provider
  invoice.
notes: >-
  There is no provider invoice, currency, or billing frequency for Fiscal Data
  itself; the FOCUS mapping below describes the zero-cost government service so
  it can sit alongside paid services in a unified cost view. Optimize your own
  infrastructure: cache responses to the report's update cadence and pull only
  changed records with record_date filters.
