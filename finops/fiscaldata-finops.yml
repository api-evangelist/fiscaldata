meters:
- name: api_requests
  description: Requests made to Fiscal Data endpoints. No provider charge; drives only your own egress and compute.
  unit: requests
  aggregation: sum
  dimensions:
  - dataset
  - consumer
- name: data_transfer
  description: Response payload transferred and ingested by the consumer. No provider charge; a consumer-side infrastructure cost.
  unit: bytes
  aggregation: sum
  dimensions:
  - dataset
  - consumer
principles:
- name: Visibility
  description: Track which datasets your systems pull and how much data you transfer, even though the provider charges nothing, so downstream infrastructure cost stays visible.
- name: Allocation
  description: Attribute Fiscal Data ingestion to the internal workloads and teams that consume it.
- name: Optimization
  description: Use fields, filter, and record_date to pull only new or needed records; cache to the report's update cadence to avoid redundant transfer and processing.
- name: Accountability
  description: Assign owners for pipelines that ingest Fiscal Data and review their consumer-side transfer and storage footprint periodically.
