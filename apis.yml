aid: fiscaldata
url: https://raw.githubusercontent.com/api-evangelist/fiscaldata/refs/heads/main/apis.yml
name: U.S. Treasury Fiscal Data
kind: government
description: >-
  U.S. Treasury Fiscal Data is a free, public source for federal government
  financial data published by the Bureau of the Fiscal Service. Its REST API
  serves machine-readable government reports and economic indicators - the
  national debt, average interest rates on Treasury securities, daily and
  monthly Treasury statements of federal revenue and spending, Treasury
  reporting rates of exchange, and Treasury securities auctions - as JSON, CSV,
  or XML. Every dataset endpoint responds from a single database table and
  supports field selection, filtering, sorting, and pagination. No registration,
  API key, or authentication is required, and the data is in the public domain.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Government Data
- Treasury
- Economic Indicators
- Interest Rates
- Open Data
- National Debt
- Government Reports
- Public Domain
- Federal Finance
created: '2026-07-11'
modified: '2026-07-11'
specificationVersion: '0.19'
apis:
- aid: fiscaldata:fiscaldata-debt-api
  name: Treasury Debt API
  tags:
  - National Debt
  - Debt to the Penny
  - Interest Expense
  - Government Data
  - Economic Indicators
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://fiscaldata.treasury.gov/datasets/debt-to-the-penny/debt-to-the-penny
  baseURL: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
  properties:
  - url: https://fiscaldata.treasury.gov/api-documentation/
    type: Documentation
  - url: https://fiscaldata.treasury.gov/datasets/debt-to-the-penny/debt-to-the-penny
    type: APIReference
  - url: openapi/fiscaldata-openapi.yml
    type: OpenAPI
  - url: collections/fiscaldata.postman_collection.json
    type: PostmanCollection
  - url: collections/fiscaldata.opencollection.json
    type: OpenCollection
  description: >-
    National debt figures as machine-readable government reports. Debt to the
    Penny reports the total public debt outstanding each day (debt held by the
    public plus intragovernmental holdings), and the Interest Expense on the
    Debt dataset reports monthly and fiscal-year-to-date interest the federal
    government pays on its outstanding debt. Filter by record_date to pull a
    time series of the national debt or interest expense.
