  - url: openapi/fiscaldata-openapi.yml
    type: OpenAPI
  - url: collections/fiscaldata.postman_collection.json
    type: PostmanCollection
  - url: collections/fiscaldata.opencollection.json
    type: OpenCollection
  description: >-
    Treasury securities auction data - CUSIP, security type and term, auction
    and issue and maturity dates, price per 100, high and low yields, and bid
    metrics for Bills, Notes, Bonds, TIPS, and FRNs sold at Treasury auctions.
    Filter by security_type, auction_date, or maturity_date to analyze issuance
    and yields.
