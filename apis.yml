aid: fiscaldata
url: https://raw.githubusercontent.com/api-evangelist/fiscaldata/refs/heads/main/apis.yml
name: U.S. Treasury Fiscal Data
kind: government
description: >-
  U.S. Treasury Fiscal Data is a free, public source for federal government
  financial data published by the Bureau of the Fiscal Service. Its REST API
  serves machine-readable government reports and economic indicators - the
  national debt, average interest rates on Treasury securities, daily and
  monthly Treasury statements of federal revenue and spending, Treasury
  reporting rates of exchange, and Treasury securities auctions - as JSON, CSV,
  or XML. Every dataset endpoint responds from a single database table and
  supports field selection, filtering, sorting, and pagination. No registration,
  API key, or authentication is required, and the data is in the public domain.
accessModel:
  pricing: free
  onboarding: open
  trial: false
  try_now: true
  public: true
  label: Free · Open access
