  name: Treasury Securities API
  tags:
  - Treasury Securities
  - Auctions
  - Interest Rates
  - Government Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://fiscaldata.treasury.gov/datasets/auctions-query/auctions-query
  baseURL: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
