  name: Average Interest Rates API
  tags:
  - Interest Rates
  - Economic Indicators
  - Treasury Securities
  - Government Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://fiscaldata.treasury.gov/datasets/average-interest-rates-treasury-securities/average-interest-rates-on-u-s-treasury-securities
  baseURL: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
  properties:
  - url: https://fiscaldata.treasury.gov/api-documentation/
    type: Documentation
  - url: https://fiscaldata.treasury.gov/datasets/average-interest-rates-treasury-securities/average-interest-rates-on-u-s-treasury-securities
    type: APIReference
  - url: openapi/fiscaldata-openapi.yml
    type: OpenAPI
  - url: collections/fiscaldata.postman_collection.json
    type: PostmanCollection
  - url: collections/fiscaldata.opencollection.json
    type: OpenCollection
  description: >-
    Monthly average interest rates on U.S. Treasury securities by security type
    and description - Treasury Bills, Notes, Bonds, TIPS, Floating Rate Notes,
    and the various government account series. A core economic indicator for
    tracking the government's cost of borrowing over time; filter by
    security_desc and record_date to build interest-rate time series.
- aid: fiscaldata:fiscaldata-daily-treasury-statement-api
  name: Daily Treasury Statement API
  tags:
  - Cash Flow
  - Government Reports
  - Operating Cash Balance
  - Government Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://fiscaldata.treasury.gov/datasets/daily-treasury-statement/operating-cash-balance
  baseURL: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
  properties:
  - url: https://fiscaldata.treasury.gov/api-documentation/
    type: Documentation
  - url: https://fiscaldata.treasury.gov/datasets/daily-treasury-statement/operating-cash-balance
    type: APIReference
  - url: openapi/fiscaldata-openapi.yml
    type: OpenAPI
  - url: collections/fiscaldata.postman_collection.json
    type: PostmanCollection
  - url: collections/fiscaldata.opencollection.json
    type: OpenCollection
  description: >-
    The Daily Treasury Statement (DTS) summarizes the federal government's cash
    and debt operations each business day - the Treasury General Account
    operating cash balance, deposits and withdrawals of operating cash, public
    debt transactions, and tax deposits. Near-real-time government-finance
    reporting for daily cash-flow and liquidity analysis.
- aid: fiscaldata:fiscaldata-monthly-treasury-statement-api
  name: Monthly Treasury Statement API
  tags:
  - Federal Revenue
  - Federal Spending
  - Budget Deficit
  - Economic Indicators
  - Government Reports
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://fiscaldata.treasury.gov/datasets/monthly-treasury-statement/summary-of-receipts-and-outlays-of-the-u-s-government
  baseURL: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
  properties:
  - url: https://fiscaldata.treasury.gov/api-documentation/
    type: Documentation
  - url: https://fiscaldata.treasury.gov/datasets/monthly-treasury-statement/summary-of-receipts-and-outlays-of-the-u-s-government
    type: APIReference
  - url: openapi/fiscaldata-openapi.yml
    type: OpenAPI
  - url: collections/fiscaldata.postman_collection.json
    type: PostmanCollection
  - url: collections/fiscaldata.opencollection.json
    type: OpenCollection
  description: >-
    The Monthly Treasury Statement (MTS) is the official monthly report of
    federal government receipts (revenue) and outlays (spending), the resulting
    budget surplus or deficit, and the means of financing it. Multiple table
    endpoints break out receipts by source, outlays by agency and function, and
    the deficit - the primary economic indicators for U.S. fiscal policy.
- aid: fiscaldata:fiscaldata-exchange-rates-api
  name: Treasury Reporting Rates of Exchange API
  tags:
  - Exchange Rates
  - Currency
  - Government Data
  - Economic Indicators
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://fiscaldata.treasury.gov/datasets/treasury-reporting-rates-exchange/treasury-reporting-rates-of-exchange
  baseURL: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
  properties:
  - url: https://fiscaldata.treasury.gov/api-documentation/
    type: Documentation
  - url: https://fiscaldata.treasury.gov/datasets/treasury-reporting-rates-exchange/treasury-reporting-rates-of-exchange
    type: APIReference
  - url: openapi/fiscaldata-openapi.yml
    type: OpenAPI
  - url: collections/fiscaldata.postman_collection.json
    type: PostmanCollection
  - url: collections/fiscaldata.opencollection.json
    type: OpenCollection
  description: >-
    The official U.S. Treasury Reporting Rates of Exchange - the exchange rates
    the federal government uses to convert foreign currency balances into U.S.
    dollars for reporting. Rates are provided quarterly per country and
    currency, with an effective_date; filter by country_currency_desc and
    record_date to retrieve the official rate for any supported currency.
